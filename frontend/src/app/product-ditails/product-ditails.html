<div class="product-details">

    <div class="gallery">

        <div class="main-image">
            <img
                [src]=getImageUrl(selectedImageId)
                alt="Glavna slika"
            >
        </div>

        <div class="thumbnails">
            @for (image of item.images; track image) {
                @if(image !== selectedImageId){
                    <div
                    class="thumbnail"
                    (click)="selectImage(image)"
                >
                    <img
                        [src]=getImageUrl(image)
                        alt="Slika 1"
                    >
                </div>
            }
            }
        </div>

    </div>


    <div class="product-info">

        <h1>{{ item.name }}</h1>

        <div class="info-row">
            <span class="label">Štamparija:</span>
            <span>{{ item.print }}</span>
        </div>

        <div class="info-row">
            <span class="label">Grad:</span>
            <span>{{ item.city }}</span>
        </div>

        <div class="ratings">

            <div class="rating like">
                <span>👍</span>
                <span>{{ item.like_cnt }}</span>
            </div>

            <div class="rating dislike">
                <span>👎</span>
                <span>{{ item.dislike_cnt }}</span>
            </div>

        </div>

    </div>

</div>
