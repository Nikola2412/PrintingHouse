<nav class="navbar">

  <!-- Home -->
  <a
    routerLink="/home"
    routerLinkActive="active"
    [routerLinkActiveOptions]="{ exact: true }"
    class="home"
  >
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 640">
      <path d="M341.8 72.6C329.5 61.2 310.5 61.2 298.3 72.6L74.3 280.6C64.7 289.6 61.5 303.5 66.3 315.7C71.1 327.9 82.8 336 96 336L112 336L112 512C112 547.3 140.7 576 176 576L464 576C499.3 576 528 547.3 528 512L528 336L544 336C557.2 336 569 327.9 573.8 315.7C578.6 303.5 575.4 289.5 565.8 280.6L341.8 72.6zM304 384L336 384C362.5 384 384 405.5 384 432L384 528L256 528L256 432C256 405.5 277.5 384 304 384z"/>
    </svg>

    <span>Printing House</span>
  </a>


  <!-- Search -->
  <form class="search" (ngSubmit)="onSearch()">

      <div class="search-input-wrapper">

          <input
              type="text"
              [(ngModel)]="searchTerm"
              name="search"
              placeholder="Search"
              (input)="onSearchInput()"
              autocomplete="off"
          >

          <!-- Suggestions -->
          @if (searchTerm.length > 0 && suggestions.length > 0) {
            <div class="search-suggestions">

                @for (product of suggestions; track product.id) {
                    <div
                        class="suggestion"
                        (click)="selectProduct(product)"
                    >
                        <span>{{ product.name }}</span>
                        <small>{{ product.description }}</small>
                    </div>
                }

            </div>
          }

      </div>


      <select
          [(ngModel)]="selectedCategory"
          name="category"
          class="category-select"
      >
          <option [ngValue]="0">
              Sve kategorije
          </option>

          @for (category of categories; track category.id) {
              <option [ngValue]="category.id">
                  {{ category.name }}
              </option>
          }
      </select>


      <button type="submit">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 640">
              <path d="M480 272C480 317.9 465.1 360.3 440 394.7L566.6 521.4C579.1 533.9 579.1 554.2 566.6 566.7C554.1 579.2 533.8 579.2 521.3 566.7L394.7 440C360.3 465.1 317.9 480 272 480C157.1 480 64 386.9 64 272C64 157.1 157.1 64 272 64C386.9 64 480 157.1 480 272zM272 416C351.5 416 416 351.5 416 272C416 192.5 351.5 128 272 128C192.5 128 128 192.5 128 272C128 351.5 192.5 416 272 416z"/>
          </svg>
      </button>

  </form>


  <!-- Login -->
  <a
    routerLink="/login"
    routerLinkActive="login-active"
    class="login"
  >
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 640">
      <path d="M463 448.2C440.9 409.8 399.4 384 352 384L288 384C240.6 384 199.1 409.8 177 448.2C212.2 487.4 263.2 512 320 512C376.8 512 427.8 487.3 463 448.2zM64 320C64 178.6 178.6 64 320 64C461.4 64 576 178.6 576 320C576 461.4 461.4 576 320 576C178.6 576 64 461.4 64 320zM320 336C359.8 336 392 303.8 392 264C392 224.2 359.8 192 320 192C280.2 192 248 224.2 248 264C248 303.8 280.2 336 320 336z"/>
    </svg>

    <span>Prijava</span>
  </a>

</nav>
